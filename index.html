<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Live telemetry from the Wecon RH-W edge controller." />
    <!-- Default follows the phone's own light/dark setting; a signed-in viewer
         can override it (see hooks/useTheme.js), in which case the script
         below is what makes that override apply to this first frame instead
         of a light-mode flash on every reload. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rhw-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>INSTRUBYTE Telemetry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
